<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#04050c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<title>NEON NEXUS</title>
<!-- Single-file build: no framework, minimal runtime dependencies. -->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#04050c;
  --cyan:#00f0ff;
  --magenta:#ff2bd6;
  --violet:#8b5cff;
  --lime:#4dff9e;
  --amber:#ffb347;
  --red:#ff4d6d;
  --text:#dff6ff;
  --dim:rgba(223,246,255,.55);
  --glass:linear-gradient(160deg,rgba(18,24,45,.75),rgba(8,10,22,.65));
  --border:rgba(0,240,255,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

html{height:100%;overflow:hidden}
body{
  height:100%;
  height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:14px;
  line-height:1.4;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  touch-action:manipulation;
}

/* ===== BG ===== */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 600px at 10% 5%,rgba(0,240,255,.10),transparent 60%),
  radial-gradient(900px 600px at 90% 95%,rgba(255,43,214,.10),transparent 60%),
  var(--bg);
}
.grid{position:absolute;inset:-20%;background-image:
  linear-gradient(rgba(0,240,255,.06) 1px,transparent 1px),
  linear-gradient(90deg,rgba(0,240,255,.06) 1px,transparent 1px);
  background-size:44px 44px;
  transform:perspective(600px) rotateX(58deg) translateY(-8%);
  animation:gs 8s linear infinite;
  -webkit-mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 70%);
  mask-image:radial-gradient(circle at 50% 40%,#000 0%,transparent 70%);
  opacity:.5;
}
@keyframes gs{from{background-position:0 0,0 0}to{background-position:0 44px,44px 0}}

/* ===== SCREENS ===== */
.screen{
  position:fixed;inset:0;z-index:2;
  display:none;
  align-items:center;justify-content:center;
  padding:calc(12px + var(--safe-t)) calc(12px + var(--safe-r)) calc(12px + var(--safe-b)) calc(12px + var(--safe-l));
  overflow:hidden;
}
.screen.active{display:flex}

/* ===== GLASS ===== */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:blur(10px);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.6),0 0 30px rgba(0,240,255,.05);
}

/* ===== PANEL ===== */
.panel{
  width:100%;
  max-width:480px;
  padding:26px 22px;
  position:relative;
  max-height:calc(100dvh - 24px - var(--safe-t) - var(--safe-b));
  overflow-y:auto;
  overscroll-behavior:contain;
}
.panel.wide{max-width:640px}

/* ===== TYPO ===== */
.logo{
  font-size:clamp(26px,7vw,40px);
  letter-spacing:.12em;
  font-weight:800;
  text-align:center;
  color:#eafcff;
  text-shadow:0 0 10px var(--cyan),0 0 30px rgba(0,240,255,.6);
}
.tag{text-align:center;font-size:10px;letter-spacing:.24em;color:var(--dim);margin:6px 0 22px}
.title{font-size:clamp(15px,4vw,19px);letter-spacing:.16em;text-align:center;color:#cdf6ff;text-shadow:0 0 12px var(--cyan);margin-bottom:16px}

/* ===== FORM ===== */
.lbl{display:block;font-size:10px;letter-spacing:.2em;color:rgba(0,240,255,.85);margin-bottom:8px}.mode-label{margin-top:14px}.back-btn{margin-top:8px}
.inp-wrap{
  display:flex;align-items:center;gap:8px;
  padding:12px 14px;
  border-radius:12px;
  border:1px solid rgba(0,240,255,.25);
  background:rgba(4,8,20,.75);
  transition:border-color .2s,box-shadow .2s;
}
.inp-wrap:focus-within{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.12)}
.inp-wrap .p{color:var(--lime);font-weight:800;font-size:15px}
input[type=text]{
  flex:1;min-width:0;border:none;outline:none;background:transparent;
  color:var(--text);font-family:inherit;font-size:16px;  /* 16px prevents iOS zoom */
  letter-spacing:.08em;text-transform:uppercase;
}
input.plain{text-transform:none;font-size:14px;letter-spacing:.02em}
input::placeholder{color:rgba(223,246,255,.28)}
.hint{font-size:10.5px;color:var(--dim);margin-top:8px;min-height:14px}
.hint.err{color:var(--red)}

/* ===== BTN ===== */
.btn{
  font-family:inherit;font-size:13px;letter-spacing:.12em;font-weight:700;
  border-radius:12px;border:1px solid transparent;
  padding:13px 20px;cursor:pointer;
  transition:transform .1s,box-shadow .2s,border-color .2s,background .2s;
  outline:none;user-select:none;
  background:rgba(255,255,255,.03);color:var(--text);
  min-height:46px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:active{transform:scale(.97)}
.btn-block{width:100%;margin-top:14px}
.btn-primary{
  background:linear-gradient(120deg,rgba(0,240,255,.22),rgba(139,92,255,.22));
  border-color:var(--cyan);color:#eafcff;
  text-shadow:0 0 10px var(--cyan);
  box-shadow:0 0 20px rgba(0,240,255,.2),inset 0 0 20px rgba(0,240,255,.06);
}
.btn-ghost{border-color:rgba(139,92,255,.45);color:rgba(223,246,255,.85);background:rgba(139,92,255,.06)}
.btn-danger{border-color:rgba(255,77,109,.5);color:#ffd0d8;background:rgba(255,77,109,.08)}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* ===== OPTIONS ===== */
.opts{display:grid;gap:8px}
.opts-2{grid-template-columns:1fr 1fr}
.opts-3{grid-template-columns:repeat(3,1fr)}
.opt{
  padding:12px 10px;
  border-radius:12px;
  border:1px solid rgba(0,240,255,.2);
  background:linear-gradient(155deg,rgba(0,240,255,.05),rgba(139,92,255,.05));
  cursor:pointer;color:var(--text);text-align:center;
  font-family:inherit;font-size:12px;letter-spacing:.08em;
  transition:transform .1s,border-color .2s,box-shadow .2s;
  min-height:64px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
}
.opt:active{transform:scale(.97)}
.opt .ic{font-size:22px;line-height:1}
.opt .nm{font-weight:800;font-size:12px;letter-spacing:.1em}
.opt .ds{font-size:9px;color:var(--dim)}
.opt.sel{border-color:var(--cyan);background:linear-gradient(155deg,rgba(0,240,255,.18),rgba(139,92,255,.14));box-shadow:0 0 20px rgba(0,240,255,.3)}

/* ===== NET ===== */
.net{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:16px;font-size:10px;letter-spacing:.16em;color:var(--dim)}
.net .d{width:7px;height:7px;border-radius:50%;background:var(--red);box-shadow:0 0 8px currentColor;color:var(--red);flex:0 0 auto}
.net.on .d{background:var(--lime);color:var(--lime);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}

/* ===== LOBBY ===== */
.loader{position:relative;width:96px;height:96px;margin:16px auto}
.ring{position:absolute;inset:0;border-radius:50%;border:2px solid transparent}
.r1{border-top-color:var(--cyan);animation:sp 1.3s linear infinite}
.r2{inset:14px;border-bottom-color:var(--magenta);animation:sp 1.9s linear infinite reverse}
.r3{inset:28px;border-top-color:var(--violet);animation:sp 2.4s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.core{position:absolute;inset:40px;border-radius:50%;background:radial-gradient(circle,var(--cyan),transparent 70%);animation:cp 1.4s ease-in-out infinite}
@keyframes cp{50%{transform:scale(1.2);opacity:.7}}
.lobby-st{text-align:center;font-size:13px;letter-spacing:.14em;color:#cdf6ff;margin-top:6px}
.lobby-sb{text-align:center;font-size:10px;color:var(--dim);margin-top:6px}
.sync{display:flex;align-items:center;justify-content:center;gap:7px;margin:16px 0;font-size:10px;letter-spacing:.14em;color:var(--dim)}
.sync .d{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:pulse 1.2s ease-in-out infinite}

/* ===== GAME LAYOUT ===== */
#screen-game{align-items:stretch;justify-content:center}
.game{
  width:100%;max-width:900px;
  display:flex;flex-direction:column;gap:8px;
  height:100%;
  max-height:calc(100dvh - 24px - var(--safe-t) - var(--safe-b));
  margin:auto;
}

/* scoreboard */
.score{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:6px;padding:8px 10px;flex:0 0 auto;
}
.ptag{
  display:flex;align-items:center;gap:8px;
  padding:7px 9px;border-radius:10px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);
  transition:border-color .25s,box-shadow .25s;
  min-width:0;
}
.ptag.r{justify-content:flex-end}
.ptag.on{border-color:currentColor;background:rgba(255,255,255,.05)}
#tagX.on{color:var(--cyan);box-shadow:0 0 18px rgba(0,240,255,.3)}
#tagO.on{color:var(--magenta);box-shadow:0 0 18px rgba(255,43,214,.3)}
.sym{
  width:34px;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;
  border-radius:8px;font-size:17px;font-weight:800;
  border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.35);
}
#tagX .sym{color:var(--cyan);text-shadow:0 0 10px var(--cyan)}
#tagO .sym{color:var(--magenta);text-shadow:0 0 10px var(--magenta)}
.tmeta{display:flex;flex-direction:column;min-width:0}
.tmeta.r{align-items:flex-end;text-align:right}
.tname{font-size:11px;font-weight:800;letter-spacing:.08em;color:#eafcff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px}
.trole{font-size:8.5px;letter-spacing:.12em;color:var(--dim)}
.tscore{margin-left:auto;font-size:20px;font-weight:800;min-width:26px;text-align:center;color:#eafcff}
.ptag.r .tscore{margin-left:0;margin-right:auto}
.vs{text-align:center;padding:0 4px}
.vst{font-size:12px;font-weight:800;letter-spacing:.15em;color:var(--violet);text-shadow:0 0 12px var(--violet)}
.rnd{font-size:8.5px;letter-spacing:.1em;color:var(--dim);margin-top:2px}

/* status */
.st{
  padding:10px 14px;text-align:center;
  font-size:12px;letter-spacing:.12em;font-weight:700;
  border-radius:12px;flex:0 0 auto;min-height:40px;
  display:flex;align-items:center;justify-content:center;
  transition:color .3s,border-color .3s;
}
.st.turn{color:var(--cyan);border-color:rgba(0,240,255,.5);text-shadow:0 0 12px var(--cyan)}
.st.wait{color:rgba(223,246,255,.7)}
.st.win{color:var(--lime);border-color:rgba(77,255,158,.55);text-shadow:0 0 14px var(--lime)}
.st.lose{color:var(--red);border-color:rgba(255,77,109,.55);text-shadow:0 0 12px var(--red)}
.st.draw{color:var(--amber);border-color:rgba(255,179,71,.55);text-shadow:0 0 12px var(--amber)}

/* main area — board + chat */
.main{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
  min-height:0;
  overflow:hidden;
}
.board-shell{
  display:flex;align-items:center;justify-content:center;
  padding:10px;min-height:0;
}
.board{
	  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:8px;
	  width:min(100%,min(60vh,360px));
	  aspect-ratio:1/1;
}
.cell{
	  position:relative;
	  border-radius:12px;
  border:1px solid rgba(0,240,255,.22);
  background:linear-gradient(150deg,rgba(0,240,255,.05),rgba(139,92,255,.05));
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
	  font-family:inherit;font-size:clamp(32px,12vmin,60px);font-weight:800;
  color:transparent;
  outline:none;user-select:none;
  transition:transform .1s,border-color .2s,box-shadow .2s;
	  padding:0;
}
.cell .m{display:block;max-width:none;padding:0;border:0;background:none;font-size:inherit;line-height:1;color:inherit}
.cell:active:not(:disabled){transform:scale(.95)}
@media (hover:hover){
  .cell:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 20px rgba(0,240,255,.35)}
}
.cell.x .m{color:var(--cyan);text-shadow:0 0 10px var(--cyan),0 0 26px rgba(0,240,255,.5)}
.cell.o .m{color:var(--magenta);text-shadow:0 0 10px var(--magenta),0 0 26px rgba(255,43,214,.5)}
.cell.win{border-color:var(--lime);background:linear-gradient(150deg,rgba(77,255,158,.15),rgba(0,240,255,.06));box-shadow:0 0 22px rgba(77,255,158,.6)}
.cell.pop .m{animation:pp .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes pp{0%{transform:scale(.4)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.board.px .cell:not(.f):not(:disabled):hover::before{content:"X";color:rgba(0,240,255,.25);text-shadow:0 0 10px rgba(0,240,255,.4);position:absolute}
.board.po .cell:not(.f):not(:disabled):hover::before{content:"O";color:rgba(255,43,214,.25);text-shadow:0 0 10px rgba(255,43,214,.4);position:absolute}

/* chat */
.chat{
  display:flex;flex-direction:column;
  border-radius:14px;overflow:hidden;
  min-height:0;
  flex:1 1 auto;
}
.chat-h{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 12px;border-bottom:1px solid rgba(0,240,255,.12);
  background:rgba(0,240,255,.03);flex:0 0 auto;
}
.chat-h .t{font-size:10px;letter-spacing:.16em;color:rgba(0,240,255,.85)}
.chat-h .c{font-size:9px;color:var(--dim);border:1px solid rgba(0,240,255,.2);border-radius:20px;padding:1px 7px}
.log{
  flex:1 1 auto;overflow-y:auto;padding:10px;
  display:flex;flex-direction:column;gap:6px;
  min-height:80px;
  -webkit-overflow-scrolling:touch;
}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:rgba(0,240,255,.3);border-radius:4px}
.m{
  display:flex;flex-direction:column;gap:1px;
  max-width:85%;padding:6px 9px;border-radius:10px;
  border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.03);
  font-size:11.5px;word-wrap:break-word;
}
.m .w{font-size:8.5px;letter-spacing:.14em;color:rgba(0,240,255,.8)}
.m .t{font-size:11.5px;color:rgba(230,248,255,.95);line-height:1.35;white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:linear-gradient(140deg,rgba(0,240,255,.14),rgba(139,92,255,.1));border-color:rgba(0,240,255,.28)}
.m.me .w{color:rgba(139,92,255,.95)}
.m.them{align-self:flex-start;background:linear-gradient(140deg,rgba(255,43,214,.1),rgba(255,43,214,.03));border-color:rgba(255,43,214,.22)}
.m.them .w{color:rgba(255,43,214,.9)}
.m.sys{align-self:center;max-width:95%;text-align:center;background:rgba(139,92,255,.08);border-color:rgba(139,92,255,.22);border-style:dashed}
.m.sys .t{font-size:10.5px;color:rgba(223,246,255,.7);font-style:italic}
.chat-f{
  display:flex;gap:6px;padding:8px 10px;
  border-top:1px solid rgba(0,240,255,.12);
  background:rgba(0,0,0,.25);flex:0 0 auto;
}
.chat-f .inp-wrap{flex:1;padding:8px 10px;border-radius:10px}
.send{
  flex:0 0 auto;padding:0 14px;border-radius:10px;
  min-height:42px;min-width:46px;
  border-color:rgba(0,240,255,.5);color:var(--cyan);background:rgba(0,240,255,.08);
}

/* footer */
.foot{
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  flex:0 0 auto;
}
.foot .btn{flex:1 1 auto;min-width:120px;min-height:42px;font-size:11.5px;padding:10px 12px}

/* toast */
.toast{
  position:fixed;top:calc(14px + var(--safe-t));left:50%;
  transform:translate(-50%,-150%);
  z-index:90;padding:10px 18px;border-radius:10px;
  font-size:11px;letter-spacing:.12em;color:#eafcff;
  background:linear-gradient(150deg,rgba(18,24,45,.95),rgba(8,10,22,.95));
  border:1px solid var(--cyan);
  box-shadow:0 0 24px rgba(0,240,255,.3),0 12px 40px rgba(0,0,0,.7);
  transition:transform .35s cubic-bezier(.2,1,.4,1);
  opacity:0;pointer-events:none;
  max-width:calc(100vw - 32px);
  text-align:center;
}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.err{border-color:var(--red);box-shadow:0 0 24px rgba(255,77,109,.35)}
.toast.ok{border-color:var(--lime);box-shadow:0 0 24px rgba(77,255,158,.35)}

/* ===== TABLET & DESKTOP ===== */
@media (min-width:640px){
  .panel{padding:32px 28px}
  .tname{max-width:140px}
  .tscore{font-size:24px;min-width:32px}
  .sym{width:40px;height:40px;flex-basis:40px;font-size:20px}
  .board{width:min(100%,min(65vh,440px))}
  .main{grid-template-columns:1.4fr 1fr}
  .chat{max-height:none}
  .log{min-height:120px}
}
@media (min-width:1024px){
  .game{max-width:1000px}
  .board{width:min(100%,min(70vh,480px))}
}

/* ===== MOBILE PORTRAIT — stack board over chat ===== */
@media (max-width:639px){
  .main{grid-template-rows:auto 1fr;overflow:hidden}
  .board-shell{flex:0 0 auto}
  .board{width:min(100%,min(52vh,320px))}
  .chat{min-height:140px;max-height:38vh}
}

/* ===== SHORT SCREENS — landscape phones ===== */
@media (max-height:520px) and (orientation:landscape){
  .main{grid-template-columns:1.4fr 1fr !important}
  .board{width:min(100%,min(78vh,340px))}
  .panel{padding:18px 16px}
  .log{min-height:60px}
  .chat{max-height:calc(100dvh - 160px)}
  .foot .btn{min-height:36px;padding:8px 10px;font-size:11px}
}

/* ===== TINY PHONES ===== */
@media (max-width:360px){
  .tname{max-width:60px;font-size:10px}
  .trole{font-size:8px}
  .tscore{font-size:17px;min-width:22px}
  .sym{width:30px;height:30px;flex-basis:30px;font-size:15px}
  .foot .btn{min-width:100px;font-size:11px}
  .board{gap:6px}
}

/* reduce motion */
@media (prefers-reduced-motion:reduce){
  .grid{animation:none}

  *,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="grid"></div></div>

<!-- ============================ IDENTITY ============================ -->
<section class="screen active" id="s-id">
  <div class="panel glass">
    <h1 class="logo">NEON NEXUS</h1>
    <p class="tag">◈ REAL-TIME MULTIPLAYER ◈</p>
    <form id="id-form" autocomplete="off" novalidate>
      <label class="lbl" for="callsign">CALLSIGN</label>
      <div class="inp-wrap">
        <span class="p">&gt;</span>
        <input id="callsign" type="text" maxlength="16" autocomplete="off" spellcheck="false" placeholder="ENTER NAME..." />
      </div>
      <p class="hint" id="hint">3–16 chars. Letters, numbers, _ and - only.</p>
      <button type="submit" class="btn btn-primary btn-block">⚡ START</button>
    </form>
    <div class="net" id="net1"><span class="d"></span><span id="net1t">NEXUS: STANDBY</span></div>
  </div>
</section>

<!-- ============================ MODE SELECT ============================ -->
<section class="screen" id="s-mode">
  <div class="panel glass">
    <h2 class="title">SELECT MODE</h2>

    <label class="lbl">OPPONENT</label>
    <div class="opts opts-2" id="opp-opts">
      <button type="button" class="opt sel" data-opp="ai">
        <span class="ic">🤖</span><span class="nm">VS AI</span><span class="ds">Offline</span>
      </button>
      <button type="button" class="opt" data-opp="online">
        <span class="ic">🌐</span><span class="nm">ONLINE</span><span class="ds">Real PvP</span>
      </button>
    </div>

    <label class="lbl mode-label">DIFFICULTY</label>
    <div class="opts opts-3" id="diff-opts">
      <button type="button" class="opt" data-diff="easy">
        <span class="ic">🟢</span><span class="nm">EASY</span><span class="ds">Beginner</span>
      </button>
      <button type="button" class="opt sel" data-diff="medium">

// ===== AUDIO (lightweight, no overhead) =====
var Audio = (function(){
  var ctx=null, master=null, enabled=true, volume=0.5, booted=false;
  function boot(){
    if(booted)return ctx;
    booted=true;
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    try{ctx=new AC()}catch(e){return null}
    master=ctx.createGain();

  function tone(freq,dur,type,gain,toFreq){
    if(!enabled)return;
    var c=boot();if(!c)return;
    var t0=c.currentTime;
    var o=c.createOscillator(), g=c.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(freq,t0);
    if(toFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,toFreq),t0+dur);

    o.connect(g);g.connect(master);

// ===== WIN CHECK =====
function evaluate(board){
  for(var i=0;i<8;i++){
    var l=LINES[i];
    var a=board[l[0]],b=board[l[1]],c=board[l[2]];
    if(a&&a===b&&a===c)return {winner:a,line:l};
  }
  var full=true;
  for(var k=0;k<9;k++)if(!board[k]){full=false;break}
  if(full)return {winner:"draw",line:null};
  return {winner:null,line:null};
}
function normBoard(raw){
  var out=["","","","","","","","",""];
  if(Array.isArray(raw)){for(var i=0;i<9;i++)out[i]=raw[i]?String(raw[i]):""}
  return out;
}

// ===== AI — REAL DIFFICULTY =====
// EASY: 80% random, no lookahead
// MEDIUM: blocks obvious wins, looks 1 move ahead
// HARD: full minimax (unbeatable)
function minimax(board, player, depth, alpha, beta){
  var r = evaluate(board);
  if(r.winner==="O") return 10-depth;
  if(r.winner==="X") return depth-10;
  if(r.winner==="draw") return 0;

  var best = player==="O" ? -Infinity : Infinity;
  for(var i=0;i<9;i++){
    if(board[i])continue;
    board[i]=player;
    var score = minimax(board, player==="O"?"X":"O", depth+1, alpha, beta);
    board[i]="";
    if(player==="O"){
      if(score>best)best=score;
      if(best>alpha)alpha=best;
    } else {
      if(score<best)best=score;
      if(best<beta)beta=best;
    }
    if(beta<=alpha)break;
  }
  return best;
}
function bestMove(board){
  var bestScore=-Infinity, bestIdx=-1;
  var work=board.slice();
  for(var i=0;i<9;i++){
    if(work[i])continue;
    work[i]="O";
    var s=minimax(work,"X",0,-Infinity,Infinity);
    work[i]="";
    if(s>bestScore){bestScore=s;bestIdx=i}
  }
  return bestIdx;
}
function mediumMove(board){
  // 1. Win if possible
  for(var i=0;i<9;i++){
    if(board[i])continue;
    var t=board.slice(); t[i]="O";
    if(evaluate(t).winner==="O")return i;
  }
  // 2. Block X's immediate win
  for(var j=0;j<9;j++){
    if(board[j])continue;
    var t2=board.slice(); t2[j]="X";
    if(evaluate(t2).winner==="X")return j;
  }
  // 3. Take center if free
  if(!board[4])return 4;
  // 4. Take a random corner
  var corners=[0,2,6,8].filter(function(k){return !board[k]});
  if(corners.length)return corners[(Math.random()*corners.length)|0];
  // 5. Random
  var empties=[];
  for(var k=0;k<9;k++)if(!board[k])empties.push(k);
  return empties[(Math.random()*empties.length)|0];
}
function easyMove(board){
  var empties=[];
  for(var i=0;i<9;i++)if(!board[i])empties.push(i);
  if(!empties.length)return -1;
  // Occasionally block a win (20%)
  if(Math.random()<0.2){
    for(var j=0;j<9;j++){
      if(board[j])continue;
      var t=board.slice(); t[j]="X";
      if(evaluate(t).winner==="X")return j;
    }
  }
  return empties[(Math.random()*empties.length)|0];
}
function chooseMove(board, diff){
  if(diff==="easy")return easyMove(board);
  if(diff==="medium")return mediumMove(board);
  return bestMove(board); // hard
}

  if(S.winner==="draw")Audio.draw();
  else if(iWin)Audio.win();

  // save to localStorage stats
  try{

    st.games=(st.games||0)+1;
    if(iWin&&S.winner!=="draw")st.wins=(st.wins||0)+1;

function tryPair(){
  if(!S.queueRef){$("#lstatus").textContent="QUEUE ERR";return}
  var claimed=null;
  S.queueRef.transaction(function(cur){
    claimed=null;
    var now=Date.now();
    if(cur&&typeof cur==="object"){
      var keys=Object.keys(cur);
      for(var i=0;i<keys.length;i++){
        var e=cur[keys[i]];
        if(!e||typeof e!=="object"){delete cur[keys[i]];continue}
        if(e.uid===net.uid)continue;
        var t=typeof e.ts==="number"?e.ts:0;
        if(t&&now-t>STALE)delete cur[keys[i]];
      }
      var others=[];
      var rem=Object.keys(cur);
      for(var j=0;j<rem.length;j++){
        var k=rem[j],c=cur[k];
        if(c&&c.uid&&c.uid!==net.uid)others.push(k);
      }
      if(others.length){
        others.sort(function(a,b){return((cur[a]&&cur[a].ts)||0)-((cur[b]&&cur[b].ts)||0)});
        var ck=others[0];
        claimed={uid:cur[ck].uid,name:String(cur[ck].name||"OPP")};
        delete cur[ck];
      }
    }
    return cur;
  },function(err){
    if(err){$("#lstatus").textContent="RETRYING…";setTimeout(tryPair,1400);return}
    if(claimed){$("#sync").textContent="OPPONENT FOUND";createRoom(claimed)}
    else enqueue();
  });
}
function enqueue(){
  if(!S.queueRef)return;
  S.myQueueRef=S.queueRef.child(net.uid);
  S.myQueueRef.set({uid:net.uid,name:S.me,ts:Date.now()});
  S.myQueueRef.onDisconnect().remove();
  $("#lstatus").textContent="WAITING…";
  $("#lsub").textContent="AS: "+String(S.me).toUpperCase();
  $("#sync").textContent="SYNC: QUEUED";
}
function createRoom(opp){
  var gid="g_"+Date.now().toString(36)+"_"+rnd(6);
  var ref=net.db.ref(GAMES+"/"+gid);
  var payload={
    board:["","","","","","","","",""],
    turn:"X",status:"playing",winner:null,line:null,
    players:{
      X:{uid:opp.uid,name:opp.name},
      O:{uid:net.uid,name:S.me}
    },
    joined:{X:false,O:false},presence:{X:false,O:false},
    chat:[],createdAt:Date.now()
  };
  ref.set(payload).then(function(){
    return net.db.ref(MATCH+"/"+opp.uid).set({gameId:gid,symbol:"X",ts:Date.now()});
  }).then(function(){enterRoom(gid,"O")})
  .catch(function(err){
    $("#lstatus").textContent="FAILED";
    $("#lsub").textContent=err&&err.message?err.message:"ERR";
    toast("ROOM FAILED","err");
  });
}
function cleanupMatch(){
  if(S.qWatchRef){S.qWatchRef.off();S.qWatchRef=null}
  if(S.matchRef){S.matchRef.off();S.matchRef.remove();S.matchRef=null}
  if(S.myQueueRef){
    try{S.myQueueRef.onDisconnect().cancel()}catch(e){}
    S.myQueueRef.remove();S.myQueueRef=null;
  }
  S.queueRef=null;
  if(S.joinT){clearTimeout(S.joinT);S.joinT=null}
}
function enterRoom(gid,sym){
  cleanupMatch();
  S.mode="online";
  S.mySym=sym;
  S.roomId=gid;
  S.round=1;
  S.scoreX=0;S.scoreO=0;
  S.bothIn=false;S.oppGone=false;
  resetRound();

  S.roomRef=net.db.ref(GAMES+"/"+gid);
  S.roomRef.child("presence/"+sym).set(true);
  S.roomRef.child("presence/"+sym).onDisconnect().remove();
  S.roomRef.child("joined/"+sym).set(true);
  S.roomRef.child("joined/"+sym).onDisconnect().remove();
  S.roomRef.on("value",onRoom,function(){toast("SYNC ERR","err")});

  S.chatRef=S.roomRef.child("chat").limitToLast(50);
  S.chatRef.on("child_added",function(s){
    var p=s.val();if(!p)return;
    addChat(p,p.uid!==net.uid);
  });

  clearChat();
  addChat({uid:"__sys__",name:"SYSTEM",text:"Match found. You are "+sym+".",ts:Date.now()},true);
  buildBoard();
  show("s-game");
  render();
  Audio.match();
  toast("MATCH FOUND — "+sym,"ok");

  if(S.joinT)clearTimeout(S.joinT);
  S.joinT=setTimeout(function(){
    if(!S.bothIn)abandon("OPPONENT UNREACHABLE");
  },20000);
}
function onRoom(snap){
  var r=snap.val();
  if(!r){if(S.mode==="online"){S.oppGone=true;render()}return}
  var prev=S.status;
  S.board=normBoard(r.board);
  S.turn=r.turn==="O"?"O":"X";
  S.status=r.status==="finished"?"finished":"playing";
  S.winner=r.winner||null;
  S.line=Array.isArray(r.line)?r.line:null;
  if(r.players)S.players={X:r.players.X||S.players.X,O:r.players.O||S.players.O};

  if(r.joined&&r.joined.X&&r.joined.O){
    if(!S.bothIn){
      S.bothIn=true;
      addChat({uid:"__sys__",name:"SYSTEM",text:"Both players ready.",ts:Date.now()},true);
    }
    if(S.joinT){clearTimeout(S.joinT);S.joinT=null}
  }
  if(S.bothIn&&r.presence){
    var opp=S.mySym==="X"?"O":"X";
    if(r.joined&&r.joined[opp]&&!r.presence[opp]){
      if(!S.oppGone){S.oppGone=true;toast("OPPONENT LEFT","err")}
    }
  }
  if(prev==="finished"&&S.status==="playing"){
    S.round++;S.scored=false;
    addChat({uid:"__sys__",name:"SYSTEM",text:"Rematch!",ts:Date.now()},true);
  }
  if(S.status==="finished"&&prev!=="finished"){
    if(!S.scored){
      S.scored=true;
      if(S.winner==="X")S.scoreX++;else if(S.winner==="O")S.scoreO++;else{S.scoreX++;S.scoreO++}
      var iWin=S.winner===S.mySym;
      if(S.winner==="draw")Audio.draw();
      else if(iWin)Audio.win();
      else Audio.lose();
    }
  }
  render();
}
function submitMove(idx){
  if(!S.roomRef)return;
  var sym=S.mySym;
  S.roomRef.transaction(function(r){
    if(!r)return r;
    if(r.status!=="playing")return;
    if((r.turn||"X")!==sym)return;
    var b=normBoard(r.board);
    if(b[idx])return;
    b[idx]=sym;
    var res=evaluate(b);
    r.board=b;
    if(res.winner){r.status="finished";r.winner=res.winner;r.line=res.line}
    else r.turn=sym==="X"?"O":"X";
    return r;
  },function(err,committed){
    if(err)toast("MOVE ERR","err");
    else if(!committed)Audio.error();
  });
  Audio[sym==="X"?"placeX":"placeO"]();
}
function abandon(reason){
  cleanupRoom();cleanupMatch();
  resetAll();
  show("s-mode");
  Audio.error();
  toast(reason||"MATCH ENDED","err");
}
function cleanupRoom(){
  if(S.chatRef){S.chatRef.off();S.chatRef=null}
  if(S.roomRef){
    S.roomRef.off("value",onRoom);
    try{
      S.roomRef.child("presence/"+S.mySym).onDisconnect().cancel();
      S.roomRef.child("joined/"+S.mySym).onDisconnect().cancel();
    }catch(e){}
    S.roomRef=null;
  }
  if(S.joinT){clearTimeout(S.joinT);S.joinT=null}
}
function resetAll(){
  S.mode=null;S.mySym="X";S.round=1;
  S.scoreX=0;S.scoreO=0;S.roomId=null;S.roomRef=null;S.chatRef=null;
  S.bothIn=false;S.oppGone=false;
  resetRound();
  clearChat();
}

// ===== REMATCH =====
function rematch(){
  Audio.unlock();
  if(S.mode==="ai"){
    S.round++;
    resetRound();
    buildBoard();
    render();
    toast("NEW ROUND","ok");
    return;
  }
  if(S.mode==="online"&&S.roomRef){
    if(S.status!=="finished"){toast("WAIT FOR END","err");return}
    S.roomRef.child("rematch/"+net.uid).set(true);
    toast("REQUEST SENT");
  }
}

// ===== WIRE EVENTS =====
function wire(){
  // identity
  $("#id-form").addEventListener("submit",function(e){
    e.preventDefault();
    Audio.unlock();
    var v=String($("#callsign").value||"").trim();
    if(!NAME_RE.test(v)){
      $("#hint").textContent="INVALID — 3–16 chars";
      $("#hint").classList.add("err");
      Audio.error();return;
    }
    S.me=v;
    try{localStorage.setItem("nn_name",v)}catch(e){}
    $("#hint").textContent="OK";
    $("#hint").classList.remove("err");
    Audio.ui();
    show("s-mode");
  });
  $("#callsign").addEventListener("input",function(){
    $("#hint").classList.remove("err");
    $("#hint").textContent="3–16 chars. Letters, numbers, _ and - only.";
  });

  // mode selectors
  $$("[data-opp]").forEach(function(b){
    b.addEventListener("click",function(){
      $$("[data-opp]").forEach(function(x){x.classList.remove("sel")});
      b.classList.add("sel");
      Audio.ui();
    });
  });
  $$("[data-diff]").forEach(function(b){
    b.addEventListener("click",function(){
      $$("[data-diff]").forEach(function(x){x.classList.remove("sel")});
      b.classList.add("sel");
      Audio.ui();
    });
  });

  // play
  $("#go").addEventListener("click",function(){
    Audio.unlock();
    var opp=$(".opt.sel[data-opp]");
    var d=$(".opt.sel[data-diff]");
    S.diff = d?d.getAttribute("data-diff"):"medium";
    var mode = opp?opp.getAttribute("data-opp"):"ai";
    if(mode==="online") startMatch();
    else startAI();
  });

  // back
  $("#back-id").addEventListener("click",function(){
    Audio.ui();
    $("#callsign").value=S.me||"";
    show("s-id");
    setTimeout(function(){$("#callsign").focus()},200);
  });

  // lobby cancel
  $("#cancel").addEventListener("click",function(){
    Audio.ui();
    cleanupMatch();resetAll();
    show("s-mode");
    toast("CANCELLED");
  });

  // game
  boardEl.addEventListener("click",function(e){
    var cell=e.target.closest(".cell");
    if(cell)onCell(Number(cell.dataset.i));
  });
  $("#rematch").addEventListener("click",rematch);
  $("#menu").addEventListener("click",function(){
    cleanupRoom();cleanupMatch();resetAll();
    show("s-mode");
    Audio.ui();
  });

  // chat
  $("#chat-form").addEventListener("submit",function(e){
    e.preventDefault();
    Audio.unlock();
    var t=$("#chat-input").value;
    $("#chat-input").value="";
    sendChat(t);
    $("#chat-input").focus();
  });

  // global unlock
  var once=function(){Audio.unlock();window.removeEventListener("pointerdown",once);window.removeEventListener("keydown",once)};
  window.addEventListener("pointerdown",once);
  window.addEventListener("keydown",once);

  // esc
  document.addEventListener("keydown",function(e){
    if(e.key==="Escape"&&$("#s-game").classList.contains("active")){
      cleanupRoom();cleanupMatch();resetAll();
      show("s-mode");
    }
  });

  // unload cleanup
  window.addEventListener("beforeunload",function(){
    try{if(S.myQueueRef)S.myQueueRef.remove()}catch(e){}
  });

}

// ===== BOOT =====
function boot(){
  wire();
  buildBoard();
  // Firebase is deferred so the first screen can paint immediately.
  (function waitForFirebase(tries){
    if(window.firebase&&firebase.initializeApp){initFB();return}
    if(tries<80)setTimeout(function(){waitForFirebase(tries+1)},50);
    else setNet("NEXUS: SDK OFFLINE",false);
  })(0);
  // restore name
  try{
    var n=localStorage.getItem("nn_name");
    if(n&&NAME_RE.test(n)){S.me=n;$("#callsign").value=n}
  }catch(e){}
  show("s-id");
  // focus on desktop only (avoid mobile keyboard popping)
  if(window.matchMedia("(hover:hover)").matches){
    setTimeout(function(){var i=$("#callsign");if(i&&!i.value)i.focus()},400);
  }
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
